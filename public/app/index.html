<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DBSpeed</title>
  <meta name="theme-color" content="#14241F">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icones/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="/couleurs.css">
  <script src="/sensations.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           color: var(--texte); font-family: system-ui, -apple-system, sans-serif;
           padding: 24px 16px; text-align: center; }
    .bloc { max-width: 380px; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 30px; margin: 16px 0 8px; font-style: italic; }
    img { box-shadow: 0 0 0 2px var(--or-700), 0 10px 30px rgba(0,0,0,.5); }
    p { color: var(--texte-doux); line-height: 1.5; }
    .bloc { padding: 28px 22px; border-radius: 18px; }
    a { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 10px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body class="marbre-vert">
  <div class="bloc marbre-bordeaux cadre-or">
    <img src="/icones/icone-192.png" alt="">

    <p>L'appli est bien installée 👍<br>La connexion et tes temps arrivent très bientôt ici.</p>
    <a class="bouton-or" href="/">Retour au site</a>

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
